backend:
  name: github
  repo: nicolaievich/nicolas-calmels
  branch: main
  base_url: "https://sveltia-cms-auth.calmelsnicolas83.workers.dev"
media_folder: "img/uploads"
public_folder: "/img/uploads"
site_url: "https://nicolascalmels.com"
display_url: "https://nicolascalmels.com"

collections:
  - name: "contenido"
    label: "Contenido del sitio"
    files:
      - label: "Inicio"
        name: "site"
        file: "content/site.json"
        format: "json"
        fields:
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Nombre", name: "name", widget: "string"}
          - {label: "Texto superior", name: "eyebrow", widget: "string"}
          - label: "Imágenes"
            name: "images"
            widget: "object"
            required: false
            fields:
              - {label: "Favicon", name: "favicon", widget: "image", required: false}
              - {label: "Imagen principal", name: "hero", widget: "image", required: false}
          - {label: "Presentación", name: "intro", widget: "text"}
          - {label: "Tarjetas de inicio", name: "homeCards", widget: "list", fields: [{label: "Kicker", name: "kicker", widget: "string"}, {label: "Título", name: "title", widget: "string"}, {label: "Descripción", name: "description", widget: "text"}, {label: "Enlace", name: "url", widget: "string", required: false}]}
          - {label: "Texto actual", name: "currentText", widget: "text"}
          - {label: "Texto de contacto", name: "contactText", widget: "text"}
          - {label: "Email", name: "email", widget: "string"}
      - label: "Perfil"
        name: "profile"
        file: "content/profile.json"
        format: "json"
        fields:
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Introducción", name: "intro", widget: "text"}
          - {label: "Historia y perfil", name: "story", widget: "text"}
          - {label: "Principios de trabajo", name: "principles", widget: "list", fields: [{label: "Kicker", name: "kicker", widget: "string"}, {label: "Título", name: "title", widget: "string"}, {label: "Descripción", name: "description", widget: "text"}]}
      - label: "Experiencia"
        name: "experience"
        file: "content/experience.json"
        format: "json"
        fields:
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Introducción", name: "intro", widget: "text"}
          - {label: "Experiencias", name: "items", widget: "list", fields: [{label: "Período", name: "period", widget: "string"}, {label: "Título", name: "title", widget: "string"}, {label: "Descripción", name: "description", widget: "text"}]}
      - label: "Proyectos"
        name: "projects"
        file: "content/projects.json"
        format: "json"
        fields:
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Introducción", name: "intro", widget: "text"}
          - {label: "Proyectos", name: "items", widget: "list", fields: [{label: "Kicker", name: "kicker", widget: "string"}, {label: "Título", name: "title", widget: "string"}, {label: "Descripción", name: "description", widget: "text"}, {label: "URL", name: "url", widget: "string", required: false}, {label: "Texto del enlace", name: "linkLabel", widget: "string", required: false}]}
      - label: "Formación"
        name: "education"
        file: "content/education.json"
        format: "json"
        fields:
          - {label: "Título", name: "title", widget: "string"}
          - {label: "Introducción", name: "intro", widget: "text"}
          - {label: "Formación", name: "items", widget: "list", fields: [{label: "Período", name: "period", widget: "string"}, {label: "Título", name: "title", widget: "string"}, {label: "Descripción", name: "description", widget: "text"}]}
